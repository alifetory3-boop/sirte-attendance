<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسجيل الحضور - سرت</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f766e 0%, #134e4a 45%, #0c2b28 100%);
    background-attachment: fixed;
  }
  .card {
    max-width: 420px;
    margin: 0 auto;
    background: rgba(255,255,255,0.14);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  h1 { font-size: 20px; text-align: center; color: #ffffff; margin-bottom: 20px; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  select, button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.4);
    font-size: 16px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.22);
    color: #ffffff;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  select option, select optgroup { color: #111; }
  button {
    background: rgba(0,150,136,0.55);
    color: white;
    border: 1px solid rgba(255,255,255,0.45);
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); }
  button.secondary {
    background: rgba(198,40,40,0.35);
    color: #fff;
    border: 1px solid rgba(255,120,120,0.6);
  }
  #preview {
    width: 100%;
    border-radius: 14px;
    margin-bottom: 12px;
    display: none;
    border: 1px solid rgba(255,255,255,0.4);
  }
  #status {
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    margin-top: 12px;
    font-weight: bold;
    display: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .ok { background: rgba(76,175,80,0.35); color: #ffffff; border: 1px solid rgba(76,175,80,0.6); }
  .warn { background: rgba(255,167,38,0.35); color: #ffffff; border: 1px solid rgba(255,167,38,0.6); }
  .err { background: rgba(239,83,80,0.35); color: #ffffff; border: 1px solid rgba(239,83,80,0.6); }
  label { font-size: 14px; color: rgba(255,255,255,0.85); margin-bottom: 6px; display: block; }
  .divider { text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; margin: 6px 0 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>📍 تسجيل الحضور - سرت</h1>

  <label>اختر فريقك ثم اسمك</label>
  <select id="workerSelect">
    <option value="">جاري تحميل قائمة العمال...</option>
  </select>

  <label>التقط صورة وجهك</label>
  <input type="file" id="photoInput" accept="image/*" capture="user" style="width:100%; margin-bottom:12px;">
  <img id="preview" alt="معاينة الصورة">

  <button id="checkInBtn" disabled>تسجيل الحضور الآن</button>

  <div class="divider">— أو —</div>

  <button id="sickBtn" class="secondary" disabled>🤒 الإبلاغ عن مرض اليوم</button>

  <div id="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const TEAMS = [
  { id: 'dump_truck_drivers',      label: 'سائقين شاحنة دنبر' },
  { id: 'container_drivers',       label: 'سائقين صندوق كنتر' },
  { id: 'large_compactor_drivers', label: 'سائقين كباسة كبيرة' },
  { id: 'small_compactor_drivers', label: 'سائقين كباسة صغيرة' },
  { id: 'guards',                  label: 'غفير' },
  { id: 'gardens_workers',         label: 'عمال حدائق' },
  { id: 'cleaning_workers',        label: 'عمال نظافة' },
  { id: 'compactor_workers',       label: 'عمال كباسات' },
  { id: 'electricians',           label: 'عمال كهربائي' },
  { id: 'cleaning_supervisors',    label: 'مشرف نظافة' },
  { id: '',                        label: 'أخرى / غير مصنّف' },
];

function compressImageToBase64(file, maxWidth = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const workerSelect = document.getElementById('workerSelect');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const checkInBtn = document.getElementById('checkInBtn');
const sickBtn = document.getElementById('sickBtn');
const statusDiv = document.getElementById('status');

let selectedFile = null;

function showStatus(msg, type) {
  statusDiv.textContent = msg;
  statusDiv.className = type;
  statusDiv.style.display = 'block';
}

function updateButtonState() {
  checkInBtn.disabled = !(workerSelect.value && selectedFile);
  sickBtn.disabled = !workerSelect.value;
}

auth.signInAnonymously().catch(err => {
  showStatus('خطأ في الاتصال: ' + err.message, 'err');
});

db.collection('workers').orderBy('name').get().then(snapshot => {
  if (snapshot.empty) {
    workerSelect.innerHTML = '<option value="">لا يوجد عمال مسجلين بعد - راجع الإدارة</option>';
    return;
  }

  const byTeam = {};
  TEAMS.forEach(t => byTeam[t.id] = []);

  snapshot.forEach(doc => {
    const data = doc.data();
    const teamId = TEAMS.some(t => t.id === (data.team || '')) ? (data.team || '') : '';
    byTeam[teamId].push({ id: doc.id, name: data.name || doc.id });
  });

  workerSelect.innerHTML = '<option value="">-- اختر اسمك --</option>';
  TEAMS.forEach(team => {
    const members = byTeam[team.id];
    if (!members.length) return;
    const group = document.createElement('optgroup');
    group.label = team.label;
    members.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name;
      group.appendChild(opt);
    });
    workerSelect.appendChild(group);
  });
}).catch(err => {
  showStatus('تعذر تحميل قائمة العمال: ' + err.message, 'err');
});

workerSelect.addEventListener('change', updateButtonState);

photoInput.addEventListener('change', () => {
  selectedFile = photoInput.files[0] || null;
  if (selectedFile) {
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
  }
  updateButtonState();
});

checkInBtn.addEventListener('click', async () => {
  checkInBtn.disabled = true;
  showStatus('جاري تحديد موقعك...', 'warn');

  if (!navigator.geolocation) {
    showStatus('المتصفح لا يدعم تحديد الموقع', 'err');
    checkInBtn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(async (position) => {
    try {
      const accuracy = Math.round(position.coords.accuracy || 0);

      if (accuracy > 150) {
        showStatus(`⚠️ دقة الموقع ضعيفة (${accuracy} م) - حاول في مكان مفتوح`, 'warn');
        checkInBtn.disabled = false;
        return;
      }

      showStatus(`جاري تجهيز الصورة... (دقة الموقع ${accuracy} م)`, 'warn');
      const workerId = workerSelect.value;
      const photoBase64 = await compressImageToBase64(selectedFile);

      showStatus('جاري حفظ سجل الحضور...', 'warn');

      const now = new Date();
      const cutoff = new Date(now);
      cutoff.setHours(8, 0, 0, 0);
      const status = now > cutoff ? 'late' : 'present';

      await db.collection('attendance').add({
        workerId: workerId,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        accuracy: accuracy,
        photoBase64: photoBase64,
        status: status
      });

      showStatus(status === 'present' ? `✅ تم تسجيل حضورك بدقة ${accuracy} م` : `⏰ تم تسجيل حضورك (متأخر) بدقة ${accuracy} م`, 'ok');
    } catch (err) {
      showStatus('خطأ: ' + err.message, 'err');
    } finally {
      checkInBtn.disabled = false;
    }
  }, (err) => {
    showStatus('تعذر تحديد الموقع: فعّل خدمة الموقع للمتصفح من الإعدادات', 'err');
    checkInBtn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});

sickBtn.addEventListener('click', async () => {
  sickBtn.disabled = true;
  showStatus('جاري تسجيل الحالة...', 'warn');
  try {
    const workerId = workerSelect.value;
    await db.collection('attendance').add({
      workerId: workerId,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      lat: null,
      lng: null,
      photoBase64: '',
      status: 'sick'
    });
    showStatus('🤒 تم تسجيل حالتك (مريض) اليوم - سلامتك', 'ok');
  } catch (err) {
    showStatus('خطأ: ' + err.message, 'err');
  } finally {
    sickBtn.disabled = false;
  }
});
</script>

</body>
</html>
