<script>
  // دالة تسجيل الدخول المحلية
  function handleLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById('loginName').value.trim();
    const pin = document.getElementById('loginPin').value.trim();

    // التحقق من اسم المستخدم والرقم السري
    if (username === "المدير" && pin === "12345") {
      alert("تم تسجيل الدخول بنجاح!");
      // توجيه المستخدم إلى لوحة التحكم
      window.location.href = "dashboard.html"; // استبدل باسم صفحة المنظومة الرئيسية
    } else {
      alert("اسم المستخدم أو الرقم السري غير صحيح!");
    }
  }

  // ربط الدالة بنموذج الدخول عند تحميل الصفحة
  document.addEventListener("DOMContentLoaded", () => {
    const loginForm = document.querySelector('form') || document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', handleLogin);
    }
  });
</script>
