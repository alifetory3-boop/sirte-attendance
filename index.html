<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- أدوات: تنظيف النصوص ---------- */
window.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeName = s => String(s == null ? '' : s).replace(/[<>"'`\\&]/g, '').replace(/\s+/g, ' ').trim();
window.safeName = safeName;

/* ---------- تاريخ اليوم بالتوقيت المحلي ---------- */
window.getTodayISO = function () {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

/* ---------- تتبّع المستمعات لإلغائها عند الخروج ---------- */
const unsubs = [];
try {
  if (typeof firebase !== 'undefined' && firebase.firestore) {
    [firebase.firestore.Query, firebase.firestore.CollectionReference].forEach(C => {
      if (C && Object.prototype.hasOwnProperty.call(C.prototype, 'onSnapshot')) {
        const orig = C.prototype.onSnapshot;
        C.prototype.onSnapshot = function () { const u = orig.apply(this, arguments); unsubs.push(u); return u; };
      }
    });
  }
} catch (e) { console.warn('onSnapshot patch', e); }

const origLoadReports = window.loadReports;
let repUnsub = null;
window.loadReports = function () {
  if (repUnsub) { try { repUnsub(); } catch (e) {} }
  if (typeof origLoadReports === 'function') origLoadReports();
  repUnsub = unsubs[unsubs.length - 1];
};

/* ---------- قوائم العمال والسائقين ---------- */
window.watchWorkers = function () {
  if (typeof db === 'undefined' || !db) return;
  db.collection('workers').orderBy('name').onSnapshot(sn => {
    window.allWorkers = sn.docs.map(d => { const x = d.data(); return Object.assign({ id: d.id }, x, { name: safeName(x.name) }); });
    if (typeof renderWorkersList === 'function') renderWorkersList();
    if (typeof updateDailyMarkList === 'function') updateDailyMarkList();
    if (typeof updateStats === 'function') updateStats();
  });
};
window.watchDrivers = function () {
  if (typeof db === 'undefined' || !db) return;
  db.collection('drivers').orderBy('name').onSnapshot(sn => {
    window.allDrivers = sn.docs.map(d => { const x = d.data(); return Object.assign({ id: d.id }, x, { name: safeName(x.name) }); });
    if (typeof renderDriversList === 'function') renderDriversList();
    if (typeof updateDailyMarkList === 'function') updateDailyMarkList();
    if (typeof populateOvertimeDriverSelect === 'function') populateOvertimeDriverSelect();
    if (typeof updateStats === 'function') updateStats();
  });
};

/* ---------- تسجيل الدخول ---------- */
window.login = async function () {
  const loginNameEl = $('loginName'), loginPinEl = $('loginPin'), msg = $('loginMsg');
  const name = loginNameEl ? loginNameEl.value.trim() : '';
  const pin = loginPinEl ? loginPinEl.value.trim() : '';
  
  const err = t => { if (msg) msg.innerHTML = '<p style="color:#c62828;">' + t + '</p>'; };
  if (!name || !pin) return err('⚠️ أدخل اسمك والرقم السري');
  if (typeof db === 'undefined' || !db) return err('❌ Firebase غير مهيأ');
  
  if (name === 'المدير' && window.appSettings && pin === appSettings.ownerPin) {
    window.currentUser = { name: 'المدير', role: 'owner' };
    window.currentUserRole = 'owner';
    window.currentUserPermissions = { all: true };
    if (typeof enterAdmin === 'function') enterAdmin();
    return;
  }
  if (msg) msg.innerHTML = '<p style="color:#f57c00;">⏳ جاري التحقق...</p>';
  
  try {
    const us = await db.collection('systemUsers').where('name', '==', name).where('pin', '==', pin).get();
    if (!us.empty) {
      const d = us.docs[0];
      window.currentUser = Object.assign({ id: d.id }, d.data());
      window.currentUser.name = safeName(window.currentUser.name);
      window.currentUserRole = window.currentUser.role || 'supervisor';
      window.currentUserPermissions = Object.assign({}, window.currentUser.permissions || {});
      if (window.currentUser.viewOnly === true) window.currentUserPermissions.viewOnly = true;
      if (typeof enterAdmin === 'function') enterAdmin();
      return;
    }
  } catch (e) { console.warn(e); }
  
  try {
    for (const [col, role] of [['workers', 'worker'], ['drivers', 'driver']]) {
      const s = await db.collection(col).where('name', '==', name).get();
      const d = s.docs.find(x => String(x.data().pin || '0000') === pin);
      if (d) {
        window.currentUser = Object.assign({ id: d.id }, d.data(), { role });
        window.currentUser.name = safeName(window.currentUser.name);
        window.currentUserRole = role;
        window.currentUserPermissions = {};
        if (typeof enterWorker === 'function') enterWorker();
        return;
      }
    }
  } catch (e) { return err('❌ ' + esc(e.message)); }
  err('❌ الاسم أو الرقم السري غير صحيح');
};

/* ---------- الخروج ---------- */
window.logout = function () {
  if (!confirm('هل تريد الخروج؟')) return;
  unsubs.splice(0).forEach(u => { try { u(); } catch (e) {} });
  document.body.classList.remove('view-only-mode');
  window.currentUser = null; window.currentUserRole = ''; window.currentUserPermissions = {};
  window.allWorkers = []; window.allDrivers = []; window.allInventory = []; window.latestAttendanceRecords = [];
  ['mainApp', 'workerView', 'adminView', 'topBar'].forEach(i => { const el = $(i); if (el) el.style.display = 'none'; });
  const loginEl = $('loginScreen'); if (loginEl) loginEl.style.display = 'block';
};

/* ---------- التبويبات ---------- */
const visibleTabs = () => [...document.querySelectorAll('#adminTabs .tab')].filter(t => t.style.display !== 'none');
const origInit = window.initializeAdmin;
window.initializeAdmin = function () {
  const tabs = [...document.querySelectorAll('#adminTabs .tab')];
  tabs.forEach(t => { t.style.display = ''; t.classList.remove('active'); });
  if (typeof origInit === 'function') origInit();
  const vis = visibleTabs();
  if (vis[0] && vis[0].onclick) vis[0].onclick();
  else { const tabOv = $('tab-overview'); if (tabOv) tabOv.style.display = 'none'; }
};
window.backToOverview = function () {
  const vis = visibleTabs();
  if (vis[0] && vis[0].onclick) vis[0].onclick();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

/* ---------- الحضور ---------- */
const LATE_HOUR = { morning: 8, night: null };
const setStatus = (t, bg) => { const s = $('status'); if (s) { s.textContent = t; s.style.display = 'block'; s.style.background = bg || ''; } };

async function saveAtt(id, name, type, status, shift, replace) {
  if (typeof db === 'undefined' || !db) return false;
  const date = getTodayISO();
  const q = await db.collection('attendance').where('date', '==', date).where('workerId', '==', id).where('shift', '==', shift).get();
  const rec = { workerId: id, workerName: safeName(name), personType: type, timestamp: firebase.firestore.FieldValue.serverTimestamp(), date, time: typeof getNowTime === 'function' ? getNowTime() : '', status, shift, hasDeduction: status === 'absent' };
  if (q.empty) { await db.collection('attendance').add(rec); return true; }
  if (!replace) return false;
  const b = db.batch(); let first = true;
  q.forEach(d => { if (first) { b.update(d.ref, rec); first = false; } else b.delete(d.ref); });
  await b.commit();
  return true;
}
async function selfMark(status, okMsg, bg) {
  if (!window.currentUser || !window.currentUser.id) return setStatus('❌ سجّل الدخول من جديد');
  try {
    const shift = typeof selectedShift !== 'undefined' ? selectedShift : '';
    const ok = await saveAtt(window.currentUser.id, window.currentUser.name, window.currentUserRole === 'driver' ? 'driver' : 'worker', status, shift, false);
    if (ok) setStatus(okMsg, bg);
    else setStatus('⚠️️ لديك تسجيل لهذه الوردية اليوم، للتعديل راجع المشرف', 'rgba(255,193,7,0.35)');
  } catch (e) { setStatus('❌ ' + e.message, 'rgba(239,83,80,0.35)'); }
}
window.markAbsent = () => selfMark('absent', '✗ تم تسجيل غيابك', 'rgba(239,83,80,0.35)');
window.markLeave = () => selfMark('leave', '📝 تم تسجيل إذنك', 'rgba(103,58,183,0.35)');
window.markSick = () => selfMark('sick', '🤒 تم تسجيل مرضك', 'rgba(173,20,87,0.35)');
window.checkIn = function () {
  setStatus('⏳ جاري تحديد موقعك...');
  if (!navigator.geolocation) return setStatus('❌ المتصفح لا يدعم الموقع');
  navigator.geolocation.getCurrentPosition(() => {
    const shift = typeof selectedShift !== 'undefined' ? selectedShift : 'morning';
    const h = LATE_HOUR[shift], now = new Date();
    let late = false;
    if (h != null) { const cut = new Date(); cut.setHours(h, 0, 0, 0); late = now > cut; }
    selfMark(late ? 'late' : 'present', '✅ تم تسجيل حضورك' + (late ? ' (متأخر)' : ''), 'rgba(76,175,80,0.35)');
  }, () => setStatus('❌ تعذّر تحديد الموقع، فعّل الموقع وأعد المحاولة', 'rgba(239,83,80,0.35)'),
  { enableHighAccuracy: true, timeout: 15000 });
};
window.manualMark = async function (id, name, status) {
  if (typeof checkAddPermission === 'function' && !checkAddPermission()) return;
  try { 
    const drivers = window.allDrivers || [];
    const shift = typeof adminSelectedShift !== 'undefined' ? adminSelectedShift : '';
    await saveAtt(id, name, drivers.some(d => d.id === id) ? 'driver' : 'worker', status, shift, true); 
  } catch (e) { alert('❌ ' + e.message); }
};

/* ---------- الوقت الإضافي ---------- */
window.saveOvertime = async function () {
  if (typeof checkAddPermission === 'function' && !checkAddPermission()) return;
  const sel = $('overtimeDriverSelect');
  if (!sel) return;
  const driverId = sel.value;
  const opt = sel.options[sel.selectedIndex];
  const driverName = safeName(opt ? opt.dataset.name : '');
  const dateEl = $('overtimeDate'), hoursEl = $('overtimeHours'), noteEl = $('overtimeNote');
  const date = dateEl ? dateEl.value : '', hours = hoursEl ? Number(hoursEl.value) || 0 : 0, note = noteEl ? noteEl.value.trim() : '';
  if (!driverId || !date || hours <= 0) { alert('أكمل البيانات'); return; }
  try {
    await db.collection('overtime').add({ driverId, driverName, date, hours, note, createdBy: window.currentUser ? window.currentUser.name : '', createdTime: typeof getNowTime === 'function' ? getNowTime() : '', createdAt: new Date(date + 'T12:00:00'), recordedAt: firebase.firestore.FieldValue.serverTimestamp() });
    alert('✅ تم التسجيل');
    sel.value = ''; if (hoursEl) hoursEl.value = ''; if (noteEl) noteEl.value = '';
    if (typeof loadOvertimeList === 'function') loadOvertimeList();
    if (typeof updateStats === 'function') updateStats();
  } catch (e) { alert('❌ ' + e.message); }
};

/* ---------- الخصومات ---------- */
async function dedData() {
  const sel = $('deductionMonthSelect');
  if (!sel || !sel.value) return [];
  const v = sel.value, [y, m] = v.split('-').map(Number);
  const nx = new Date(y, m, 1);
  const to = nx.getFullYear() + '-' + String(nx.getMonth() + 1).padStart(2, '0') + '-01';
  const sn = await db.collection('attendance').where('date', '>=', v + '-01').where('date', '<', to).get();
  const map = {};
  sn.forEach(doc => {
    const r = doc.data(); if (r.status !== 'absent') return;
    const k = r.workerId || r.workerName;
    (map[k] = map[k] || { name: r.workerName, days: new Set() }).days.add(r.date);
  });
  const amt = window.appSettings ? Number(appSettings.deductionAmount) || 0 : 0;
  return Object.values(map).map(o => ({ name: o.name, days: o.days.size, amount: o.days.size * amt }));
}
window.loadDeductions = async function () {
  const c = $('deductionsList');
  if (!c) return;
  try {
    const rows = await dedData();
    if (!rows.length) { c.innerHTML = '<p style="text-align:center;color:#666;">✅ لا يوجد خصومات</p>'; return; }
    let tot = 0;
    c.innerHTML = rows.map(r => { tot += r.amount; return '<div class="worker-row"><span class="name">' + esc(r.name) + '</span><span class="deduction-badge">' + r.days + ' يوم</span><span class="deduction-badge">-' + r.amount + ' د</span></div>'; }).join('') +
      '<div style="margin-top:10px;text-align:center;font-weight:bold;color:#0f766e;">الإجمالي: ' + tot + ' دينار</div>';
  } catch (e) { c.innerHTML = '<p style="text-align:center;color:#c62828;">⚠️ ' + esc(e.message) + '</p>'; }
};
window.exportDeductionsExcel = async function () {
  if (typeof checkExportPermission === 'function' && !checkExportPermission()) return;
  try {
    const rows = await dedData();
    if (!rows.length) { alert('لا يوجد خصومات'); return; }
    if (typeof XLSX === 'undefined') return alert('مكتبة XLSX غير معرفة');
    const ws = XLSX.utils.aoa_to_sheet([['الاسم', 'أيام الغياب', 'قيمة الخصم (د)']].concat(rows.map(r => [r.name, r.days, r.amount])));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الخصومات');
    const sel = $('deductionMonthSelect');
    XLSX.writeFile(wb, 'خصومات-' + (sel ? sel.value : '') + '.xlsx');
  } catch (e) { alert('❌ ' + e.message); }
};

// فحص أمان عند إضافة المستمع لحدث التغيير
document.addEventListener('DOMContentLoaded', () => {
  const dedMonthSel = $('deductionMonthSelect');
  if (dedMonthSel) {
    dedMonthSel.addEventListener('change', () => window.loadDeductions());
  }
});

/* ---------- PDF ---------- */
window.saveNotificationPDF = function () { if (typeof printNotification === 'function') printNotification(); };

/* ---------- تنسيقات CSS ---------- */
const fixCss = document.createElement('style');
fixCss.textContent =
  '.worker-row{flex-wrap:wrap !important;overflow:visible !important;}' +
  '.worker-row .name{flex:1 1 0 !important;min-width:60px !important;}' +
  '.worker-row .edit-form{flex:0 0 100% !important;width:100% !important;order:99;margin-top:8px;}' +
  '.edit-form input,.edit-form select{max-width:100%;}';
document.head.appendChild(fixCss);

/* ---------- الآليات ---------- */
const vl = { small_garbage_truck: 'صندوق قمامة صغير', dump_truck: 'قلاب' };
document.querySelectorAll('#vehicleType option').forEach(o => { if (vl[o.value]) o.textContent = vl[o.value]; });
})();
</script>
