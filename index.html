<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسجيل الحضور - سرت</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  .card {
    max-width: 420px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; text-align: center; color: #00695c; margin-bottom: 20px; }
  select, button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 16px;
    margin-bottom: 12px;
  }
  button {
    background: #00897b;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { background: #b0bec5; }
  button.secondary {
    background: white;
    color: #c62828;
    border: 1px solid #c62828;
  }
  #preview {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 12px;
    display: none;
  }
  #status {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
    font-weight: bold;
    display: none;
  }
  .ok { background: #e8f5e9; color: #2e7d32; }
  .warn { background: #fff3e0; color: #ef6c00; }
  .err { background: #ffebee; color: #c62828; }
  label { font-size: 14px; color: #555; margin-bottom: 6px; display: block; }
  .divider { text-align: center; color: #999; font-size: 13px; margin: 6px 0 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>📍 تسجيل الحضور - سرت</h1>

  <label>اختر فريقك ثم اسمك</label>
  <select id="workerSelect">
    <option value="">جاري تحميل قائمة العمال...</option>
  </select>

  <label>التقط صورة وجهك</label>
  <input type="file" id="photoInput" accept="image/*" capture="user" style="width:100%; margin-bottom:12px;">
  <img id="preview" alt="معاينة الصورة">

  <button id="checkInBtn" disabled>تسجيل الحضور الآن</button>

  <div class="divider">— أو —</div>

  <button id="sickBtn" class="secondary" disabled>🤒 الإبلاغ عن مرض اليوم</button>

  <div id="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const TEAMS = [
  { id: 'compactor_drivers',       label: 'سائقين كبسات' },
  { id: 'box_drivers',             label: 'سائقين صناديق' },
  { id: 'bobcat_drivers',          label: 'سائقين بوبكات' },
  { id: 'large_compactor_drivers', label: 'سائقين كبسات كبيرة' },
  { id: 'large_box_drivers',       label: 'سائقين صناديق سيارات كبيرة' },
  { id: 'cleaning_workers',        label: 'عمال نظافة' },
  { id: 'compactor_workers',       label: 'عمال كبسات' },
  { id: 'ghafra_workers',          label: 'عمال الغفرة' },
  { id: '',                        label: 'أخرى / غير مصنّف' },
];

function compressImageToBase64(file, maxWidth = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const workerSelect = document.getElementById('workerSelect');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const checkInBtn = document.getElementById('checkInBtn');
const sickBtn = document.getElementById('sickBtn');
const statusDiv = document.getElementById('status');

let selectedFile = null;

function showStatus(msg, type) {
  statusDiv.textContent = msg;
  statusDiv.className = type;
  statusDiv.style.display = 'block';
}

function updateButtonState() {
  checkInBtn.disabled = !(workerSelect.value && selectedFile);
  sickBtn.disabled = !workerSelect.value;
}

auth.signInAnonymously().catch(err => {
  showStatus('خطأ في الاتصال: ' + err.message, 'err');
});

db.collection('workers').orderBy('name').get().then(snapshot => {
  if (snapshot.empty) {
    workerSelect.innerHTML = '<option value="">لا يوجد عمال مسجلين بعد - راجع الإدارة</option>';
    return;
  }

  const byTeam = {};
  TEAMS.forEach(t => byTeam[t.id] = []);

  snapshot.forEach(doc => {
    const data = doc.data();
    const teamId = TEAMS.some(t => t.id === (data.team || '')) ? (data.team || '') : '';
    byTeam[teamId].push({ id: doc.id, name: data.name || doc.id });
  });

  workerSelect.innerHTML = '<option value="">-- اختر اسمك --</option>';
  TEAMS.forEach(team => {
    const members = byTeam[team.id];
    if (!members.length) return;
    const group = document.createElement('optgroup');
    group.label = team.label;
    members.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name;
      group.appendChild(opt);
    });
    workerSelect.appendChild(group);
  });
}).catch(err => {
  showStatus('تعذر تحميل قائمة العمال: ' + err.message, 'err');
});

workerSelect.addEventListener('change', updateButtonState);

photoInput.addEventListener('change', () => {
  selectedFile = photoInput.files[0] || null;
  if (selectedFile) {
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
  }
  updateButtonState();
});

checkInBtn.addEventListener('click', async () => {
  checkInBtn.disabled = true;
  showStatus('جاري تحديد موقعك...', 'warn');

  if (!navigator.geolocation) {
    showStatus('المتصفح لا يدعم تحديد الموقع', 'err');
    checkInBtn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(async (position) => {
    try {
      showStatus('جاري تجهيز الصورة...', 'warn');
      const workerId = workerSelect.value;
      const photoBase64 = await compressImageToBase64(selectedFile);

      showStatus('جاري حفظ سجل الحضور...', 'warn');

      const now = new Date();
      const cutoff = new Date(now);
      cutoff.setHours(8, 0, 0, 0);
      const status = now > cutoff ? 'late' : 'present';

      await db.collection('attendance').add({
        workerId: workerId,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        photoBase64: photoBase64,
        status: status
      });

      showStatus(status === 'present' ? '✅ تم تسجيل حضورك بنجاح' : '⏰ تم تسجيل حضورك (متأخر)', 'ok');
    } catch (err) {
      showStatus('خطأ: ' + err.message, 'err');
    } finally {
      checkInBtn.disabled = false;
    }
  }, (err) => {
    showStatus('تعذر تحديد الموقع: فعّل خدمة الموقع للمتصفح من الإعدادات', 'err');
    checkInBtn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 15000 });
});

sickBtn.addEventListener('click', async () => {
  sickBtn.disabled = true;
  showStatus('جاري تسجيل الحالة...', 'warn');
  try {
    const workerId = workerSelect.value;
    await db.collection('attendance').add({
      workerId: workerId,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      lat: null,
      lng: null,
      photoBase64: '',
      status: 'sick'
    });
    showStatus('🤒 تم تسجيل حالتك (مريض) اليوم - سلامتك', 'ok');
  } catch (err) {
    showStatus('خطأ: ' + err.message, 'err');
  } finally {
    sickBtn.disabled = false;
  }
});
</script>

</body>
</html>
