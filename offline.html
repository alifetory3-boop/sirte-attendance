<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا يوجد إنترنت - نظام الحضور</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f766e, #0d5c55);
    color: #fff;
    padding: 20px;
  }
  .box {
    text-align: center;
    max-width: 400px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 24px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  h1 {
    font-size: 24px;
    margin-bottom: 15px;
    font-weight: 900;
  }
  p {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 25px;
    opacity: 0.9;
  }
  button {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 2px solid #fff;
    font-size: 17px;
    font-weight: 800;
    background: #fff;
    color: #0f766e;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .info {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📵</div>
    <h1>لا يوجد إنترنت</h1>
    <p>
      يبدو أنك غير متصل بالإنترنت حالياً.<br>
      تحقق من الاتصال وحاول مرة أخرى.
    </p>
    <button onclick="location.reload()">🔄 إعادة المحاولة</button>
    <div class="info">
      نظام الحضور — شركة النظافة
    </div>
  </div>
</body>
</html>
